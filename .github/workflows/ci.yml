name: CI

# Pushes to main run this through release.yml, which releases only if it passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned: Bun 1.4 rejects a require() of ESM inside the SDK's
          # dependency tree. Bump deliberately, matching your local version.
          bun-version: 1.2.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: E2E tests
        # MV3 extensions need a headed Chromium; xvfb provides a display.
        run: xvfb-run --auto-servernum bun run e2e
