<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A self-custodial, open-source wallet for programmable Bitcoin. Send BTC and manage Arkade assets directly in your browser." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="Inscrib3 Wallet" />
    <meta property="og:title" content="Inscrib3 Wallet — Your Gateway to Programmable Bitcoin" />
    <meta property="og:description" content="A self-custodial, open-source wallet for sending BTC and managing Arkade assets in your browser." />
    <meta property="og:url" content="https://wallet.inscrib3.com/" />
    <meta property="og:image" content="https://wallet.inscrib3.com/social-card.png" />
    <meta property="og:image:secure_url" content="https://wallet.inscrib3.com/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Inscrib3 Wallet — Your gateway to programmable Bitcoin" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@inscrib3" />
    <meta name="twitter:creator" content="@inscrib3" />
    <meta name="twitter:title" content="Inscrib3 Wallet — Your Gateway to Programmable Bitcoin" />
    <meta name="twitter:description" content="A self-custodial, open-source wallet for sending BTC and managing Arkade assets in your browser." />
    <meta name="twitter:image" content="https://wallet.inscrib3.com/social-card.png" />
    <meta name="twitter:image:alt" content="Inscrib3 Wallet — Your gateway to programmable Bitcoin" />
    <link rel="canonical" href="https://wallet.inscrib3.com/" />
    <link rel="icon" type="image/svg+xml" href="/image/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Inscrib3 Wallet — Programmable Bitcoin in Your Browser</title>
    <style>
      /* same palette as the extension's index.html files - keep in sync */
      :root {
        --color-bg: #000000;
        --color-surface: #0d0f0f;
        --color-surface-alt: #131616;
        --color-border: rgba(255, 255, 255, 0.13);
        --color-border-accent: rgba(52, 211, 153, 0.42);
        --color-text: #f3f5f4;
        --color-text-muted: #9ba3a0;
        --color-accent: #34d399;
        --color-accent-text: #020806;
        --color-accent-secondary: #a855f7;
        --color-error: #ff7b7b;
        --color-success: #34d399;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100vh; font-family: system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
      body.has-top-banner { padding-top: 88px; }
      #app { max-width: 480px; margin: 0 auto; min-height: 100vh; }

      /* full-bleed on phones, a centered card on wider screens */
      @media (min-width: 640px) {
        body {
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 40px 16px;
        }
        body.has-top-banner { padding-top: 92px; }
        #app {
          width: 100%;
          /* min-height beats height, so reset it for the card */
          min-height: 0;
          height: min(780px, 90vh);
          border: 1px solid var(--color-border);
          border-radius: 24px;
          overflow: hidden;
          background: var(--color-bg);
          box-shadow: 0 45px 110px rgba(0, 0, 0, 0.72), 0 0 60px rgba(52, 211, 153, 0.055);
          display: flex;
          flex-direction: column;
        }
        /* shared screens size themselves to 100vh (right for the popup); size
           them to the card here instead */
        #app > * {
          min-height: 0;
          height: 100%;
        }
        /* Dashboard scrolls its own content area; only Setup/Unlock scroll whole */
        #app .setup,
        #app .unlock {
          overflow-y: auto;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- outside #app so the card sizing rules don't apply to them -->
    <div id="update-banner"></div>
    <div id="extension-banner"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
