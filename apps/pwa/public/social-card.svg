<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08040e"/><stop offset=".48" stop-color="#030706"/><stop offset="1" stop-color="#082117"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151918"/><stop offset="1" stop-color="#090c0b"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#a855f7" stop-opacity=".28"/><stop offset=".5" stop-color="#34d399" stop-opacity=".1"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#70ffaf" stroke-opacity=".06"/></pattern>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#000" flood-opacity=".8"/><feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#70ffaf" flood-opacity=".16"/></filter>
    <image id="butterfly" href="data:image/png;base64," width="210" height="250"/>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <ellipse cx="825" cy="305" rx="450" ry="360" fill="url(#aura)"/>
  <g transform="translate(66 58)">
    <text fill="#70ffaf" font-family="Courier New, monospace" font-size="16" letter-spacing="4">INSCRIB3 / WALLET</text>
    <path d="M0 32H500" stroke="#70ffaf" stroke-opacity=".25"/>
  </g>
  <text x="66" y="205" fill="#f6fff9" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-3">Your gateway to</text>
  <text x="66" y="283" fill="#70ffaf" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-3">programmable</text>
  <text x="66" y="361" fill="#70ffaf" font-family="Arial, Helvetica, sans-serif" font-size="65" font-weight="700" letter-spacing="-3">Bitcoin.</text>
  <text x="70" y="420" fill="#a7b7ae" font-family="Arial, Helvetica, sans-serif" font-size="20">Self-custodial · Open source · Built with Arkade</text>
  <g transform="translate(68 492)">
    <circle cx="8" cy="8" r="8" fill="#70ffaf"/>
    <text x="31" y="15" fill="#d9e8df" font-family="Courier New, monospace" font-size="17" letter-spacing="2">WALLET.INSCRIB3.COM</text>
  </g>
  <!-- Wallet interface card -->
  <g transform="translate(786 55) rotate(3 165 260)" filter="url(#shadow)">
    <rect width="330" height="520" rx="35" fill="#020303" stroke="#4b5a52" stroke-width="2"/>
    <rect x="14" y="14" width="302" height="492" rx="25" fill="url(#screen)" stroke="#26342d"/>
    <rect x="128" y="27" width="74" height="6" rx="3" fill="#39453f"/>
    <text x="38" y="75" fill="#8c9c93" font-family="Courier New, monospace" font-size="12" letter-spacing="2">TOTAL BALANCE</text>
    <text x="38" y="122" fill="#f5fff9" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">0.015 BTC</text>
    <text x="38" y="148" fill="#70ffaf" font-family="Arial, Helvetica, sans-serif" font-size="14">≈ 1,500,000 sats</text>
    <g transform="translate(38 181)">
      <rect width="112" height="42" rx="21" fill="#70ffaf"/><text x="31" y="27" fill="#041109" font-family="Arial" font-size="13" font-weight="700">SEND</text>
      <rect x="126" width="112" height="42" rx="21" fill="#1a221e" stroke="#405148"/><text x="150" y="27" fill="#d8e7df" font-family="Arial" font-size="13" font-weight="700">RECEIVE</text>
    </g>
    <text x="38" y="274" fill="#8c9c93" font-family="Courier New, monospace" font-size="12" letter-spacing="2">ASSETS</text>
    <g transform="translate(38 294)">
      <rect width="254" height="64" rx="12" fill="#121715" stroke="#28352f"/>
      <circle cx="31" cy="32" r="16" fill="#172a20"/><text x="25" y="38" fill="#70ffaf" font-family="Arial" font-size="17" font-weight="700">₿</text>
      <text x="58" y="28" fill="#eff8f3" font-family="Arial" font-size="14" font-weight="700">Bitcoin</text><text x="58" y="47" fill="#829087" font-family="Arial" font-size="11">ARKADE</text>
      <text x="232" y="37" text-anchor="end" fill="#eff8f3" font-family="Arial" font-size="13">1.5M sats</text>
    </g>
    <g transform="translate(38 370)">
      <rect width="254" height="64" rx="12" fill="#121715" stroke="#28352f"/>
      <circle cx="31" cy="32" r="16" fill="#261534"/><circle cx="31" cy="32" r="7" fill="#b56cff"/>
      <text x="58" y="28" fill="#eff8f3" font-family="Arial" font-size="14" font-weight="700">Ark assets</text><text x="58" y="47" fill="#829087" font-family="Arial" font-size="11">ISSUE · SEND · BURN</text>
      <text x="232" y="37" text-anchor="end" fill="#70ffaf" font-family="Arial" font-size="13">OPEN →</text>
    </g>
    <rect x="122" y="480" width="86" height="5" rx="3" fill="#526158"/>
  </g>
  <!-- 3D butterfly emerging from the wallet -->
  <g transform="translate(651 192) rotate(-12 105 125)" filter="url(#shadow)">
    <use href="#butterfly" x="18" y="15" opacity=".18"/>
    <use href="#butterfly" x="14" y="12" opacity=".28"/>
    <use href="#butterfly" x="10" y="8" opacity=".42"/>
    <use href="#butterfly" x="6" y="5" opacity=".62"/>
    <use href="#butterfly"/>
  </g>
  <path d="M735 176c-34-32-70-37-107-14M718 447c-48 34-87 36-126 13" fill="none" stroke="#70ffaf" stroke-opacity=".3"/>
  <circle cx="628" cy="162" r="4" fill="#b56cff"/><circle cx="592" cy="460" r="4" fill="#70ffaf"/>
</svg>