<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arkade Wallet</title>
    <style>
      /* brand palette */
      :root {
        --color-bg: #000000;
        --color-surface: #111111;
        --color-surface-alt: #1a1a1a;
        --color-border: #453a5f;
        --color-border-accent: #7458c4;
        --color-text: #f0f0f0;
        --color-text-muted: #888888;
        --color-accent: #7cfb9e;
        --color-accent-text: #000000;
        --color-accent-secondary: #8b5cf6;
        --color-error: #ff6b6b;
        --color-success: #4caf50;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 400px; font-family: system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
      /* Fixed popup height (Chrome's max), so the dashboard's header and
         Home/Settings bar stay pinned and only the middle scrolls. */
      body { height: 600px; display: flex; flex-direction: column; overflow: hidden; }
      #app { flex: 1; min-height: 0; overflow-y: auto; }
      #app > .dashboard { height: 100%; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="version-banner"></div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
