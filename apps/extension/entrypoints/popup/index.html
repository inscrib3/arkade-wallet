<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscrib3 Wallet</title>
    <style>
      /* brand palette */
      :root {
        --color-bg: #000000;
        --color-surface: #0d0f0f;
        --color-surface-alt: #131616;
        --color-border: rgba(255, 255, 255, 0.13);
        --color-border-accent: rgba(52, 211, 153, 0.42);
        --color-text: #f3f5f4;
        --color-text-muted: #9ba3a0;
        --color-accent: #34d399;
        --color-accent-text: #020806;
        --color-accent-secondary: #a855f7;
        --color-error: #ff7b7b;
        --color-success: #34d399;
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 400px; font-family: system-ui, sans-serif; background: var(--color-bg); color: var(--color-text); }
      /* Fixed popup height (Chrome's max), so the dashboard's header and
         Home/Settings bar stay pinned and only the middle scrolls. */
      body { height: 600px; display: flex; flex-direction: column; overflow: hidden; }
      #app { flex: 1; min-height: 0; overflow-y: auto; }
      #app > .dashboard { height: 100%; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="version-banner"></div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
