<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscrib3 Wallet</title>
    <style>
      /* The palette comes from @inscrib3/ui's theme.css; only the black
         background is set here so the panel doesn't flash white on open. */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; font-family: system-ui, sans-serif; background: #000000; color: #f3f5f4; }
      /* Same layout as the popup, filling whatever size the browser gives the panel. */
      body { display: flex; flex-direction: column; overflow: hidden; }
      #app { flex: 1; min-height: 0; overflow-y: auto; }
      #app > .dashboard { height: 100%; min-height: 0; }
    </style>
  </head>
  <body>
    <div id="version-banner"></div>
    <div id="app"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
